<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ستريك 🔥</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  body {
    background: linear-gradient(135deg,#1e1033,#2d1b4e 60%,#3a1c3a);
    min-height:100vh; color:#fff; display:flex; flex-direction:column; align-items:center;
    padding:20px;
  }
  h1 { margin:20px 0 5px; font-size:28px; }
  .sub { color:#c9b8e8; margin-bottom:20px; font-size:14px; }
  .card {
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    border-radius:16px; padding:18px; width:100%; max-width:420px; margin-bottom:16px;
    backdrop-filter:blur(6px);
  }
  button {
    cursor:pointer; border:none; border-radius:10px; padding:12px 16px; font-size:15px;
    font-weight:600; transition:.15s;
  }
  button:active{ transform:scale(.96); }
  .btn-google {
    background:#fff; color:#333; width:100%; display:flex; align-items:center;
    justify-content:center; gap:8px;
  }
  .btn-primary { background:linear-gradient(135deg,#ff5e62,#ff9966); color:#fff; width:100%; }
  .btn-fire {
    background:radial-gradient(circle at 30% 30%,#ffd166,#ff5e62 70%);
    color:#fff; font-size:22px; width:70px; height:70px; border-radius:50%;
    box-shadow:0 0 20px rgba(255,94,98,.6);
  }
  .btn-fire.done { background:#3a3a3a; box-shadow:none; opacity:.6; }
  .btn-sm { background:#3f2a63; color:#fff; padding:8px 12px; font-size:13px; }
  .btn-danger { background:#c0392b; color:#fff; padding:8px 12px; font-size:13px; }
  input {
    width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08); color:#fff; font-size:15px; margin-bottom:10px;
  }
  input::placeholder{ color:#b8a9d6; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .row:last-child{ border-bottom:none; }
  .uname { font-weight:600; }
  .count { font-size:13px; color:#c9b8e8; }
  .hidden{ display:none !important; }
  .top-user { display:flex; align-items:center; justify-content:space-between; width:100%; max-width:420px; margin-bottom:10px; }
  .msg { font-size:13px; color:#ffd166; margin-top:6px; min-height:16px; }
  .search-result { display:flex; justify-content:space-between; align-items:center; padding:8px 0; }
  .tag { font-size:11px; background:#ff5e62; padding:2px 8px; border-radius:20px; margin-inline-start:6px; }
</style>
</head>
<body>

<div id="loginScreen" class="card" style="max-width:380px; text-align:center; margin-top:60px;">
  <h1>🔥 ستريك</h1>
  <p class="sub">حافظ على الستريك مع صحابك يوم بيوم</p>
  <button class="btn-google" id="googleBtn">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" height="20">
    تسجيل الدخول بجوجل
  </button>
  <p class="msg" id="loginMsg"></p>
</div>

<div id="app" class="hidden" style="width:100%; max-width:420px;">
  <div class="top-user">
    <div>
      <div class="uname" id="myUsernameDisplay">...</div>
      <div class="count" id="myEmail"></div>
    </div>
    <button class="btn-danger" id="logoutBtn">خروج</button>
  </div>

  <div class="card">
    <div class="uname" style="margin-bottom:8px;">تغيير اليوزر بتاعك</div>
    <input id="newUsernameInput" placeholder="يوزر جديد (بالإنجليزي/أرقام)">
    <button class="btn-primary" id="changeUsernameBtn">حفظ اليوزر</button>
    <p class="msg" id="usernameMsg"></p>
  </div>

  <div class="card">
    <div class="uname" style="margin-bottom:8px;">دور على صاحبك باليوزر</div>
    <input id="searchInput" placeholder="اكتب اليوزر...">
    <button class="btn-primary" id="searchBtn">بحث</button>
    <div id="searchResults"></div>
    <p class="msg" id="searchMsg"></p>
  </div>

  <div class="card">
    <div class="uname" style="margin-bottom:8px;">طلبات ستريك واردة</div>
    <div id="incomingRequests"><div class="count">مفيش طلبات دلوقتي</div></div>
  </div>

  <div class="card">
    <div class="uname" style="margin-bottom:8px;">الستريكات بتاعتك 🔥</div>
    <div id="streaksList"><div class="count">لسه معملتش ستريك مع حد</div></div>
  </div>
</div>

<!-- ======= Firebase SDK ======= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   حط بيانات الفايربيز بتاعتك هنا (استبدل القيم دي)
   Firebase Console > Project Settings > General > Your apps > SDK setup
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCQcMSC0xVsnIDQVETvlvv96bo6BkMSYV0",
  authDomain: "streak-2e5c2.firebaseapp.com",
  projectId: "streak-2e5c2",
  storageBucket: "streak-2e5c2.firebasestorage.app",
  messagingSenderId: "906486174991",
  appId: "1:906486174991:web:2613e53b63154d88401a7a"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let myData = null;

// ---------- Helpers ----------
function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10); // YYYY-MM-DD (UTC based, consistent for all users)
}
function daysBetween(d1, d2) {
  const a = new Date(d1 + "T00:00:00Z");
  const b = new Date(d2 + "T00:00:00Z");
  return Math.round((b - a) / 86400000);
}
function streakId(uidA, uidB) {
  return [uidA, uidB].sort().join("_");
}
function showMsg(elId, text, timeout=3500) {
  const el = document.getElementById(elId);
  el.textContent = text;
  if (timeout) setTimeout(()=>{ if(el.textContent===text) el.textContent=""; }, timeout);
}

// ---------- Auth ----------
document.getElementById("googleBtn").addEventListener("click", async () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch(e) {
    showMsg("loginMsg", "فيه مشكلة في تسجيل الدخول: " + e.message);
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    await ensureUserDoc(user);
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("myEmail").textContent = user.email || "";
    listenToMyData();
    listenToIncomingRequests();
  } else {
    currentUser = null;
    document.getElementById("loginScreen").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
});

// إنشاء يوزر افتراضي أول مرة يسجل دخول
async function ensureUserDoc(user) {
  const ref = db.collection("users").doc(user.uid);
  const snap = await ref.get();
  if (!snap.exists) {
    let base = (user.email ? user.email.split("@")[0] : "user").replace(/[^a-zA-Z0-9_]/g,"").toLowerCase();
    if (!base) base = "user" + Math.floor(Math.random()*10000);
    let candidate = base;
    let i = 0;
    // تأكد ان اليوزر مش مكرر
    while (true) {
      const uCheck = await db.collection("usernames").doc(candidate).get();
      if (!uCheck.exists) break;
      i++;
      candidate = base + i;
    }
    await ref.set({
      username: candidate,
      email: user.email || "",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection("usernames").doc(candidate).set({ uid: user.uid });
  }
}

// ---------- تغيير اليوزر ----------
document.getElementById("changeUsernameBtn").addEventListener("click", async () => {
  const raw = document.getElementById("newUsernameInput").value.trim();
  if (!raw) { showMsg("usernameMsg","اكتب يوزر الأول"); return; }
  const newU = raw.toLowerCase().replace(/[^a-z0-9_]/g,"");
  if (newU.length < 3) { showMsg("usernameMsg","اليوزر لازم يكون 3 حروف على الأقل"); return; }

  const newRef = db.collection("usernames").doc(newU);
  const oldUsername = myData ? myData.username : null;

  try {
    await db.runTransaction(async (t) => {
      const newSnap = await t.get(newRef);
      if (newSnap.exists && newSnap.data().uid !== currentUser.uid) {
        throw new Error("taken");
      }
      const userRef = db.collection("users").doc(currentUser.uid);
      t.set(newRef, { uid: currentUser.uid });
      t.update(userRef, { username: newU });
      if (oldUsername && oldUsername !== newU) {
        t.delete(db.collection("usernames").doc(oldUsername));
      }
    });
    showMsg("usernameMsg", "تم تغيير اليوزر لـ " + newU);
    document.getElementById("newUsernameInput").value = "";
  } catch(e) {
    if (e.message === "taken") showMsg("usernameMsg","اليوزر ده متحجز، جرب واحد تاني");
    else showMsg("usernameMsg","حصل خطأ: " + e.message);
  }
});

function listenToMyData() {
  db.collection("users").doc(currentUser.uid).onSnapshot((snap) => {
    myData = snap.data();
    document.getElementById("myUsernameDisplay").textContent = "@" + (myData?.username || "");
  });
}

// ---------- البحث عن يوزر ----------
document.getElementById("searchBtn").addEventListener("click", async () => {
  const q = document.getElementById("searchInput").value.trim().toLowerCase().replace(/^@/,"");
  const resultsDiv = document.getElementById("searchResults");
  resultsDiv.innerHTML = "";
  if (!q) { showMsg("searchMsg","اكتب يوزر تدور عليه"); return; }
  if (q === myData?.username) { showMsg("searchMsg","ده انت يا صاحبي 😄"); return; }

  const snap = await db.collection("usernames").doc(q).get();
  if (!snap.exists) { showMsg("searchMsg","مفيش حد باليوزر ده"); return; }

  const targetUid = snap.data().uid;
  const userSnap = await db.collection("users").doc(targetUid).get();
  const targetData = userSnap.data();

  const div = document.createElement("div");
  div.className = "search-result";
  div.innerHTML = `<span class="uname">@${targetData.username}</span>`;
  const btn = document.createElement("button");
  btn.className = "btn-sm";
  btn.textContent = "اطلب ستريك 🔥";
  btn.onclick = () => sendStreakRequest(targetUid, targetData.username);
  div.appendChild(btn);
  resultsDiv.appendChild(div);
});

async function sendStreakRequest(targetUid, targetUsername) {
  // تأكد مفيش ستريك أو طلب موجود بالفعل
  const sid = streakId(currentUser.uid, targetUid);
  const existingStreak = await db.collection("streaks").doc(sid).get();
  if (existingStreak.exists) { showMsg("searchMsg","انتوا عندكوا ستريك مع بعض بالفعل"); return; }

  const reqId = sid; // نفس الايدي عشان مفيش تكرار
  const reqRef = db.collection("streakRequests").doc(reqId);
  const reqSnap = await reqRef.get();
  if (reqSnap.exists && reqSnap.data().status === "pending") {
    showMsg("searchMsg","فيه طلب متبعت قبل كده"); return;
  }

  await reqRef.set({
    fromUid: currentUser.uid,
    fromUsername: myData.username,
    toUid: targetUid,
    toUsername: targetUsername,
    status: "pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  showMsg("searchMsg","اتبعت الطلب لـ @" + targetUsername);
}

// ---------- الطلبات الواردة ----------
function listenToIncomingRequests() {
  db.collection("streakRequests")
    .where("toUid","==",currentUser.uid)
    .where("status","==","pending")
    .onSnapshot((snap) => {
      const container = document.getElementById("incomingRequests");
      if (snap.empty) {
        container.innerHTML = '<div class="count">مفيش طلبات دلوقتي</div>';
        return;
      }
      container.innerHTML = "";
      snap.forEach(doc => {
        const r = doc.data();
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<span class="uname">@${r.fromUsername}</span>`;
        const btns = document.createElement("div");

        const accept = document.createElement("button");
        accept.className = "btn-sm";
        accept.textContent = "قبول";
        accept.onclick = () => respondToRequest(doc.id, r, true);

        const reject = document.createElement("button");
        reject.className = "btn-danger";
        reject.style.marginRight = "6px";
        reject.textContent = "رفض";
        reject.onclick = () => respondToRequest(doc.id, r, false);

        btns.appendChild(accept);
        btns.appendChild(reject);
        row.appendChild(btns);
        container.appendChild(row);
      });
    });
}

async function respondToRequest(reqId, reqData, accepted) {
  const reqRef = db.collection("streakRequests").doc(reqId);
  if (!accepted) {
    await reqRef.update({ status: "rejected" });
    return;
  }
  const sid = streakId(reqData.fromUid, reqData.toUid);
  const streakRef = db.collection("streaks").doc(sid);
  await db.runTransaction(async (t) => {
    const s = await t.get(streakRef);
    if (!s.exists) {
      t.set(streakRef, {
        users: [reqData.fromUid, reqData.toUid],
        usernames: {
          [reqData.fromUid]: reqData.fromUsername,
          [reqData.toUid]: reqData.toUsername
        },
        count: 0,
        lastFireDate: {},          // uid -> "YYYY-MM-DD"
        lastCompletedDate: null    // آخر يوم اتفعل فيه الستريك بالكامل
      });
    }
    t.update(reqRef, { status: "accepted" });
  });
}

// ---------- الستريكات وزرار النار ----------
function listenToStreaks() {
  db.collection("streaks")
    .where("users","array-contains", currentUser.uid)
    .onSnapshot((snap) => {
      const container = document.getElementById("streaksList");
      if (snap.empty) {
        container.innerHTML = '<div class="count">لسه معملتش ستريك مع حد</div>';
        return;
      }
      container.innerHTML = "";
      snap.forEach(doc => {
        renderStreakRow(doc.id, doc.data(), container);
      });
    });
}

function renderStreakRow(sid, data, container) {
  const otherUid = data.users.find(u => u !== currentUser.uid);
  const otherName = data.usernames ? data.usernames[otherUid] : "صاحبك";

  // تحقق هل الستريك اتكسر (فاتت يوم من غير ما الاتنين يدوسوا)
  checkAndResetIfBroken(sid, data);

  const myFireDate = data.lastFireDate ? data.lastFireDate[currentUser.uid] : null;
  const pressedToday = myFireDate === todayStr();

  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `
    <div>
      <div class="uname">@${otherName}</div>
      <div class="count">🔥 ${data.count || 0} يوم متتالي</div>
    </div>
  `;
  const fireBtn = document.createElement("button");
  fireBtn.className = "btn-fire" + (pressedToday ? " done" : "");
  fireBtn.textContent = pressedToday ? "✔️" : "🔥";
  fireBtn.disabled = pressedToday;
  fireBtn.onclick = () => pressFire(sid);
  row.appendChild(fireBtn);
  container.appendChild(row);
}

async function checkAndResetIfBroken(sid, data) {
  if (!data.lastCompletedDate) return;
  const gap = daysBetween(data.lastCompletedDate, todayStr());
  // لو عدى يوم كامل من غير ما يكمل الاتنين الستريك، يترسيت
  if (gap > 1 && data.count > 0) {
    await db.collection("streaks").doc(sid).update({
      count: 0,
      lastFireDate: {}
    });
  }
}

async function pressFire(sid) {
  const streakRef = db.collection("streaks").doc(sid);
  await db.runTransaction(async (t) => {
    const s = await t.get(streakRef);
    if (!s.exists) return;
    const data = s.data();
    const today = todayStr();
    const otherUid = data.users.find(u => u !== currentUser.uid);
    const lastFireDate = data.lastFireDate || {};

    if (lastFireDate[currentUser.uid] === today) return; // دوس أصلاً النهاردة

    lastFireDate[currentUser.uid] = today;

    let newCount = data.count || 0;
    let newLastCompleted = data.lastCompletedDate || null;

    // لو الاتنين دوسوا النهاردة -> يزيد الستريك
    if (lastFireDate[otherUid] === today) {
      // تأكد ان النهاردة يوم صحيح بعد آخر يوم اكتمل فيه (مفيش فجوة)
      if (!newLastCompleted || daysBetween(newLastCompleted, today) === 1 || newCount === 0) {
        newCount = newCount + 1;
      } else if (daysBetween(newLastCompleted, today) === 0) {
        // already counted
      } else {
        newCount = 1; // اتكسر وبيبدأ تاني
      }
      newLastCompleted = today;
    }

    t.update(streakRef, {
      lastFireDate,
      count: newCount,
      lastCompletedDate: newLastCompleted
    });
  });
}

// شغل الستريكات بعد ما اليوزر يتسجل
auth.onAuthStateChanged((user) => {
  if (user) setTimeout(listenToStreaks, 500);
});
</script>
</body>
</html>
